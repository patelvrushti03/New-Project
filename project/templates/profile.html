{% extends "master.html" %}

{% block title %}
    Profile
{% endblock %}

{% block content %}

<div class="profile-box">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="profile-image">

            {% if project.profile_image %}
                <img src="{{ project.profile_image.url }}" alt="Profile">
            {% else %}
                <img src="/media/default.png" alt="Profile">
            {% endif %}

            <label for="file-input" class="edit-icon">✏️</label>

            <input type="file" id="file-input" name="profile_image">
            
        </div>

        <h2>Profile</h2>

        <label>Username</label>
        <input type="text" name="username" value="{{ project.username }}">

        <label>Email</label>
        <input type="text" name="email" value="{{ project.email }}" disabled>

        <label>Number</label>
        <input type="text" name="number" value="{{ project.number }}">

        <label>Other Number</label>
        <input type="text" name="other_num" value="{{ project.other_num }}">

        <label>Date Of Birth</label>
        <input type="date" name="date_birth" value="{{ project.date_birth|date:'Y-m-d' }}">

        <label>Address</label>
        <input type="text" name="address" value="{{ project.address }}">

        <label>Old Password</label>
        <input type="password" name="old_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" 
         title="Password must contain uppercase, lowercase, number and special character" required>
        
        <label>New Password</label>
        <input type="password" name="new_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" 
         title="Password must contain uppercase, lowercase, number and special character" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" 
         title="Password must contain uppercase, lowercase, number and special character" required>

        <button type="submit">
            Update Profile
        </button>

    </form>

</div>

{% endblock %}
