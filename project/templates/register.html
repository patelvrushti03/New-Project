{% load static %}

<html>
<head>
    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="register-body">

    <div class="register-container">

        <h2>Register</h2>

        <form method="POST">
            {% csrf_token %}

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label>UserName</label>
            <input type="text" id="username" name="username" pattern="[a-zA-Z0-9_]{3,16}" 
            title="username must be 3-16 characters long" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Number</label>
            <input type="tel" id="number" name="number" placeholder="1234567890" pattern="[6-9][0-9]{9}" 
            title="Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9" required>

            <label>Other Number</label>
            <input type="tel" id="other_number" name="other_number" placeholder="1234567890" pattern="[6-9][0-9]{9}"
            title="Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9">

            <label>Date Birth</label>
            <input type="date" name="date_birth" max="{{ today_date }}" required>

            <label>Address</label>
            <input type="text" name="address" required>

            <label>Password</label>
            <input type="password" name="password" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{6,}$" 
             title="Password must contain uppercase, lowercase, number and special character" required>

            <button type="submit">Register</button>

        </form>
    

    </div>

</body>
</html>
